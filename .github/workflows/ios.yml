# Builds the iOS app on a GitHub macOS runner and uploads it to App Store Connect (TestFlight).
# Runs only when started by hand: Actions tab -> "iOS build" -> Run workflow.
#
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID         10-character Team ID (developer.apple.com -> Membership)
#   APPLE_API_ISSUER      App Store Connect -> Users and Access -> Integrations -> Issuer ID
#   APPLE_API_KEY_ID      Key ID of an App Store Connect API key with "App Manager" access
#   APPLE_API_KEY_P8      Contents of that key's AuthKey_<id>.p8 file
# Signing is automatic (Xcode creates the certificate and profile with the API key).
name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect after building
        type: boolean
        default: true

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - run: npm ci

      - name: Write App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      # The Xcode project (src-tauri/gen/apple) is generated here, so no Mac is needed locally.
      - name: Generate iOS project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri ios init --ci

      - name: Build signed IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: npx tauri ios build --export-method app-store-connect --ci

      - uses: actions/upload-artifact@v4
        with:
          name: plagx-ios-ipa
          path: src-tauri/gen/apple/build/arm64/*.ipa

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(ls src-tauri/gen/apple/build/arm64/*.ipa | head -1)" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
